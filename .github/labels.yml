# Priorities
- name: "priority: critical"
  color: "B60205"
  description: "Work that blocks security, release, or repository operation"
- name: "priority: high"
  color: "D93F0B"
  description: "High-impact work that should be scheduled promptly"
- name: "priority: medium"
  color: "FBCA04"
  description: "Important work with normal scheduling priority"
- name: "priority: low"
  color: "0E8A16"
  description: "Useful work that can be scheduled after higher priorities"

# Status
- name: "status: backlog"
  color: "EDEDED"
  description: "Accepted work that is not yet ready to start"
- name: "status: ready"
  color: "1D76DB"
  description: "Work is refined and ready to begin"
- name: "status: blocked"
  color: "B60205"
  description: "Work cannot proceed until a dependency or decision is resolved"
- name: "status: review"
  color: "5319E7"
  description: "Work is awaiting review or approval"
- name: "status: testing"
  color: "0366D6"
  description: "Work is undergoing validation"
- name: "status: done"
  color: "0E8A16"
  description: "Work is complete and verified"

